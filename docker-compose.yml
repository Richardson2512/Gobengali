version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=GoBengali
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY env var is required}
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/models:/app/models

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
